openapi: 3.0.3
info:
  title: Cambix Kanban API
  description: API consolidada para el sistema Kanban de Cambix (FastAPI + React Monorepo).
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Login exitoso
        '401':
          description: Credenciales inválidas

  /api/v1/projects:
    get:
      summary: Listar proyectos
      tags:
        - Projects
      responses:
        '200':
          description: Lista de proyectos
        '401':
          description: No autorizado
